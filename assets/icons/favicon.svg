      <circle cx="32" cy="27.4" r="5.6" fill="#fff8e6"/>
      <rect x="18.5" y="26.6" width="27" height="3.4" fill="#0e5673"/>
      <rect x="28.6" y="27.7" width="6.8" height="1" rx=".5" fill="#ffd9a0"/>
    </g>
    <circle cx="32" cy="13.3" r="1.5" fill="#fde68a"/>
    <rect x="13" y="33.4" width="38" height="2.2" fill="#fb7185"/>
    <circle cx="21" cy="41.6" r="5" fill="#fde68a" opacity=".3"/>
    <circle cx="43" cy="41.6" r="5" fill="#fde68a" opacity=".3"/>
    <circle cx="21" cy="41.6" r="3.1" fill="#fff4d6"/>
    <circle cx="43" cy="41.6" r="3.1" fill="#fff4d6"/>
    <path d="M24 49.5 18 58.2M40 49.5l6 8.7" stroke="#0a0f24" stroke-width="3.4" stroke-linecap="round" fill="none"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Vizag Express mark: an express loco at sunrise, the sun rising over the sea in its windshield -->
  <defs>
    <linearGradient id="ve-tile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="ve-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset="1" stop-color="#ff9a5a"/>
    </linearGradient>
    <clipPath id="ve-glass">
      <rect x="18.5" y="16.5" width="27" height="13.5" rx="3.5"/>
    </clipPath>
  </defs>

  <rect id="tile" width="64" height="64" rx="16" fill="url(#ve-tile)"/>

  <g id="glyph">
    <path fill="#0a0f24" d="M24 10h16c6.6 0 11 4.4 11 11v18c0 5.5-4.5 10-10 10H23c-5.5 0-10-4.5-10-10V21c0-6.6 4.4-11 11-11Z"/>
